# One-command deployment: `docker compose up --build`
# - backend : FastAPI + LangGraph agent (embedded Chroma persistent store)
# - frontend: React SPA served by nginx, proxies /api -> backend
#
# The backend runs fully offline by default (mock LLM + hash embedding +
# lexical reranker). Provide ANTHROPIC_AUTH_TOKEN (智谱 Bearer 令牌; 兼容旧名
# AUTH_TOKEN / OPENAI_API_KEY) (and optionally switch
# EMBEDDING_BACKEND=openai / RERANKER_BACKEND=cross-encoder) to use real models.
services:
  backend:
    build: ./backend
    container_name: kap-backend
    ports:
      - "8000:8000"
    environment:
      # --- LLM (智谱 GLM, Anthropic 兼容端点; 留空 ANTHROPIC_AUTH_TOKEN 则离线 mock) ---
      ANTHROPIC_AUTH_TOKEN: "${ANTHROPIC_AUTH_TOKEN:-}"
      ANTHROPIC_BASE_URL: "${ANTHROPIC_BASE_URL:-https://open.bigmodel.cn/api/anthropic}"
      MAX_TOKENS: "${MAX_TOKENS:-1024}"
      MODEL_NAME: "${MODEL_NAME:-glm-4.5-air}"
      # 向量 embedding 走智谱 OpenAI 兼容端点（复用同一个令牌）。
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}"
      # --- RAG backends ---
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-hash}"
      OPENAI_EMBEDDING_MODEL: "${OPENAI_EMBEDDING_MODEL:-embedding-3}"
      EMBEDDING_DIM: "${EMBEDDING_DIM:-2048}"
      RERANKER_BACKEND: "${RERANKER_BACKEND:-lexical}"
      VECTOR_BACKEND: "chroma"
      CHROMA_DIR: "/app/data/chroma"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    container_name: kap-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
