# nginx config for the SPA frontend.
# Serves the built React app and proxies /api to the backend service.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: route all non-file requests to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls (incl. SSE streaming) to the backend container.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
